<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VegiBar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="28" height="28"> VegiBar</div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙︎</button>
  </header>

  <main>
    <section id="scanner" class="card scanner">
      <div id="reader" class="reader" hidden></div>
      <div id="readerPlaceholder" class="reader-placeholder">
        <div class="big-icon">▮▯▮▮▯▮</div>
        <p>Point your camera at a product barcode</p>
      </div>
      <button id="scanBtn" class="btn primary">Scan barcode</button>
      <div class="row">
        <button id="manualBtn" class="btn">Type barcode</button>
        <button id="photoBtn" class="btn">Photo of ingredients</button>
      </div>
      <input id="photoInput" type="file" accept="image/*" capture="environment" hidden>
      <form id="manualForm" class="manual" hidden>
        <input id="manualCode" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 8901058851434" autocomplete="off">
        <button class="btn primary" type="submit">Look up</button>
      </form>
    </section>

    <section id="status" class="status" hidden></section>

    <section id="result" class="card result" hidden></section>

    <section id="historySection" class="history" hidden>
      <h2>Recent</h2>
      <ul id="historyList"></ul>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" class="settings-form">
      <h2>Settings</h2>
      <label>OpenRouter API key
        <input id="apiKey" type="password" placeholder="sk-or-v1-…" autocomplete="off" spellcheck="false">
      </label>
      <p class="hint">Stored only in this browser (localStorage) and sent only to openrouter.ai.</p>
      <label>Model
        <input id="model" placeholder="openrouter/free" spellcheck="false">
      </label>
      <p class="hint">Any OpenRouter model id. Free ones end in <code>:free</code>. If it fails, a few free fallbacks are tried automatically.</p>
      <fieldset>
        <legend>Eggs count as</legend>
        <label class="radio"><input type="radio" name="eggMode" value="nonveg"> Non‑veg (Indian convention)</label>
        <label class="radio"><input type="radio" name="eggMode" value="veg"> Vegetarian (Western convention)</label>
      </fieldset>
      <div class="row">
        <button id="clearHistory" class="btn" type="button">Clear history</button>
        <button class="btn primary" value="save">Save</button>
      </div>
    </form>
  </dialog>
</body>
</html>
